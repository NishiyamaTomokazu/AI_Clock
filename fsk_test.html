<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSK デコーダー</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
    button { padding: 15px 30px; font-size: 18px; margin-bottom: 20px; cursor: pointer; }
    #output {
      width: 90%; max-width: 600px; height: 300px; margin: 0 auto;
      background: #222; color: #0f0; font-family: monospace;
      padding: 15px; font-size: 20px; text-align: left;
      border-radius: 8px; overflow-y: auto; white-space: pre-wrap;
      word-wrap: break-word; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .status { font-weight: bold; margin-bottom: 15px; color: #555; }
  </style>
</head>
<body>

  <h2>マイコン FSK通信 受信画面</h2>
  <button id="startBtn">受信スタート</button>
  <div id="statusText" class="status">マイクの許可を待っています...</div>
  <div id="output"></div>

  <script>
    // --- AudioWorklet (音声解析エンジン) のソースコード ---
    // 独立したスレッドで動くため、文字列(Blob)として定義して読み込ませます
    const workletCode = `
      class FSKDemodulator extends AudioWorkletProcessor {
        constructor() {
          super();
          // 通信仕様の設定
          const baudRate = 1200;
          this.spb = sampleRate / baudRate; // 1ビットあたりのサンプル数 (48kHzなら40)
          
          // FM検波(遅延検波)用の設定： 1800Hz(1200と2400の中間)の1/4波長分遅延させる
          this.delay = Math.round(sampleRate / (4 * 1800));
          this.delayLine = new Float32Array(this.delay);
          this.delayIdx = 0;

          // ローパスフィルタ(移動平均)用の設定
          this.maLen = Math.round(this.spb);
          this.maBuffer = new Float32Array(this.maLen);
          this.maIdx = 0;
          this.maSum = 0;

          // UART解析用の状態管理
          this.state = 'IDLE';
          this.samplesToNextBit = 0;
          this.bitCount = 0;
          this.currentByte = 0;
          this.lastBaseband = 1; // Mark(1) = 待機状態
        }

        process(inputs, outputs, parameters) {
          const input = inputs[0][0]; // マイク入力のモノラル音声データ
          if (!input) return true;

          for (let i = 0; i < input.length; i++) {
            let x = input[i];

            // 1. 遅延検波 (現在の波と、少し前の波を掛け合わせる)
            let delayedX = this.delayLine[this.delayIdx];
            this.delayLine[this.delayIdx] = x;
            this.delayIdx = (this.delayIdx + 1) % this.delay;
            let mult = x * delayedX;

            // 2. ローパスフィルタ (高周波ノイズを取り除き、0/1のベースバンド信号にする)
            this.maSum -= this.maBuffer[this.maIdx];
            this.maBuffer[this.maIdx] = mult;
            this.maSum += mult;
            this.maIdx = (this.maIdx + 1) % this.maLen;

            // プラスなら1200Hz(1:Mark)、マイナスなら2400Hz(0:Space)
            let baseband = this.maSum > 0 ? 1 : 0;

            // 3. UART (調歩同期式) のデコード処理
            if (this.state === 'IDLE') {
              // 待機中(1)からスタートビット(0)への立ち下がりを検出
              if (this.lastBaseband === 1 && baseband === 0) {
                this.state = 'DATA';
                // スタートビットの中心 + 次のデータビットの中心まで待つ (1.5ビット分)
                this.samplesToNextBit = this.spb * 1.5;
                this.bitCount = 0;
                this.currentByte = 0;
              }
            } else if (this.state === 'DATA') {
              this.samplesToNextBit--;
              if (this.samplesToNextBit <= 0) {
                if (this.bitCount < 8) {
                  // データビットをLSB(下の桁)から順に組み立てる
                  this.currentByte |= (baseband << this.bitCount);
                  this.bitCount++;
                  this.samplesToNextBit += this.spb; // 次のビットまで待つ
                } else {
                  // 8ビット読み終わったら、ストップビット(1のはず)を確認して送信
                  if (baseband === 1) {
                    this.port.postMessage(this.currentByte);
                  }
                  this.state = 'IDLE';
                }
              }
            }
            this.lastBaseband = baseband;
          }
          return true; // 処理継続
        }
      }
      registerProcessor('fsk-demodulator', FSKDemodulator);
    `;

    // --- メイン画面側の処理 ---
    let audioContext;

    document.getElementById('startBtn').addEventListener('click', async () => {
      const statusText = document.getElementById('statusText');
      try {
        // マイクアクセス要求
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // WorkletのソースコードをBlob(仮装ファイル)化して読み込む
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        const workletUrl = URL.createObjectURL(blob);
        await audioContext.audioWorklet.addModule(workletUrl);

        // マイク入力とデコーダーを接続
        const source = audioContext.createMediaStreamSource(stream);
        const demodulatorNode = new AudioWorkletNode(audioContext, 'fsk-demodulator');
        source.connect(demodulatorNode);

        // デコーダーから文字データが届いた時の処理
        const outputDiv = document.getElementById('output');
        demodulatorNode.port.onmessage = (event) => {
          const charCode = event.data;
          // 表示可能なASCII文字(32〜126)と改行のみを画面に追加
          if ((charCode >= 32 && charCode <= 126) || charCode === 10 || charCode === 13) {
            outputDiv.textContent += String.fromCharCode(charCode);
            outputDiv.scrollTop = outputDiv.scrollHeight; // 自動スクロール
          }
        };

        document.getElementById('startBtn').disabled = true;
        statusText.innerText = "受信中... マイコンからデータを送信してください";
        statusText.style.color = "blue";

      } catch (err) {
        statusText.innerText = "エラー: マイクにアクセスできませんでした";
        statusText.style.color = "red";
        console.error(err);
      }
    });
  </script>
</body>
</html>
