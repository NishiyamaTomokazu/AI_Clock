<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSK デコーダ</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 30px; }
    button { padding: 15px 30px; font-size: 18px; margin-bottom: 20px; }
    #output {
      width: 80%; height: 200px; margin: 0 auto; padding: 10px;
      border: 2px solid #ccc; font-size: 20px; text-align: left;
      overflow-y: auto; background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h2>FSK 文字デコーダ (1200bps)</h2>
  <button id="startBtn">マイク受信スタート</button>
  <div id="output"></div>

  <script>
    // AudioWorklet用の処理（別スレッドで高速に波形を解析するコード）
    const workletCode = `
      class FskDecoder extends AudioWorkletProcessor {
        constructor() {
          super();
          this.bitSamples = sampleRate / 1200; // 1ビットあたりのサンプル数
          this.state = 'IDLE';
          this.bitIndex = 0;
          this.currentByte = 0;
          this.samplesSinceEdge = 0;
          this.lastSample = 0;
          this.currentBitTimer = 0;
          this.periodSamples = 0;
        }

        process(inputs, outputs, parameters) {
          const input = inputs[0];
          if (!input || !input[0]) return true;
          const channel = input[0];

          for (let i = 0; i < channel.length; i++) {
            const sample = channel[i];

            // 波が0をまたいだ（ゼロクロス）間隔を計測
            if ((this.lastSample <= 0 && sample > 0) || (this.lastSample >= 0 && sample < 0)) {
              this.periodSamples = this.periodSamples * 0.5 + this.samplesSinceEdge * 0.5; // ノイズ対策の平均化
              this.samplesSinceEdge = 0;
            } else {
              this.samplesSinceEdge++;
            }
            this.lastSample = sample;

            // 1800Hzを境界にして、1200Hz(1)か2400Hz(0)かを判定
            const threshold = sampleRate / 1800 / 2;
            const bitVal = (this.periodSamples < threshold) ? 0 : 1;

            // シリアル通信(UART)のデータ復元処理
            if (this.state === 'IDLE') {
              if (bitVal === 0) { // スタートビット(0)を検出
                this.state = 'READ';
                this.currentBitTimer = this.bitSamples * 1.5; // 最初のデータビットの中央まで待つ
                this.bitIndex = 0;
                this.currentByte = 0;
              }
            } else if (this.state === 'READ') {
              this.currentBitTimer--;
              if (this.currentBitTimer <= 0) {
                if (this.bitIndex < 8) {
                  // データビットの読み取り
                  this.currentByte |= (bitVal << this.bitIndex);
                  this.bitIndex++;
                  this.currentBitTimer = this.bitSamples;
                } else {
                  // ストップビット到達、メインスレッドへ文字コードを送信
                  this.port.postMessage(this.currentByte);
                  this.state = 'IDLE';
                }
              }
            }
          }
          return true;
        }
      }
      registerProcessor('fsk-decoder', FskDecoder);
    `;

    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);

        // WorkletのコードをBlobとして読み込む（1ファイルで完結させるための工夫）
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        const workletUrl = URL.createObjectURL(blob);
        
        await audioContext.audioWorklet.addModule(workletUrl);
        const fskNode = new AudioWorkletNode(audioContext, 'fsk-decoder');

        // デコーダから文字を受け取って画面に表示
        fskNode.port.onmessage = (event) => {
          const charCode = event.data;
          // アスキーコードの印字可能な文字のみを表示（ノイズによる文字化け対策）
          if (charCode >= 32 && charCode <= 126) {
            const char = String.fromCharCode(charCode);
            document.getElementById('output').innerHTML += char;
          }
        };

        source.connect(fskNode);
        document.getElementById('startBtn').disabled = true;
        document.getElementById('startBtn').innerText = "受信中...";

      } catch (err) {
        alert('エラーが発生しました: ' + err);
      }
    });
  </script>
</body>
</html>
