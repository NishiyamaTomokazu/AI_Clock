<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FSKデコーダー</title>
    <style>
        :root {
            --bg: #12181f;
            --panel: #1a222b;
            --line: #2a3540;
            --text: #e6edf3;
            --sub: #8b98a5;
            --accent: #4fd1a5;
            --accent-dim: #2a5d4c;
            --warn: #e0736b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 28px 18px 60px;
        }

        h1 {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 4px;
            letter-spacing: 0.02em;
        }

        .spec {
            color: var(--sub);
            font-size: 13px;
            margin: 0 0 24px;
            line-height: 1.6;
        }

        .spec code {
            color: var(--accent);
            font-family: "SF Mono", Menlo, monospace;
            font-size: 12px;
        }

        button#startBtn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            border: 1px solid var(--accent-dim);
            background: var(--accent);
            color: #0b1410;
            cursor: pointer;
            transition: transform 0.08s ease, opacity 0.15s ease;
        }

        button#startBtn:active {
            transform: scale(0.98);
        }

        button#startBtn.running {
            background: var(--panel);
            color: var(--warn);
            border-color: var(--warn);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 2px 22px;
            font-size: 13px;
            color: var(--sub);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--sub);
            flex-shrink: 0;
        }

        .dot.on {
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        .dot.err {
            background: var(--warn);
        }

        .meter {
            height: 3px;
            background: var(--line);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 0 22px;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.05s linear;
        }

        label.field-label {
            display: block;
            font-size: 12px;
            color: var(--sub);
            margin: 0 0 8px;
        }

        textarea#output {
            width: 100%;
            min-height: 220px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--text);
            font-family: "SF Mono", Menlo, monospace;
            font-size: 15px;
            line-height: 1.6;
            padding: 14px;
            resize: vertical;
        }

        textarea#output:focus {
            outline: none;
            border-color: var(--accent-dim);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .actions button {
            flex: 1;
            padding: 10px;
            font-size: 13px;
            background: transparent;
            color: var(--sub);
            border: 1px solid var(--line);
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>FSKデコーダー</h1>
        <p class="spec">300bps / '1' = <code>1200Hz</code> / '0' = <code>2400Hz</code> / 8N1フレーム想定</p>

        <button id="startBtn">マイク入力開始</button>

        <div class="status-row">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">停止中</span>
        </div>
        <div class="meter">
            <div class="meter-fill" id="meterFill"></div>
        </div>

        <label class="field-label" for="output">受信データ</label>
        <textarea id="output" readonly placeholder="受信したテキストがここに表示されます"></textarea>

        <div class="actions">
            <button id="clearBtn">クリア</button>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const meterFill = document.getElementById('meterFill');
        const outputEl = document.getElementById('output');
        const clearBtn = document.getElementById('clearBtn');

        let audioContext = null;
        let workletNode = null;
        let mediaStream = null;
        let running = false;

        clearBtn.addEventListener('click', () => { outputEl.value = ''; });

        // AudioWorkletProcessor のソース。Blob URL 経由で読み込む(別ファイル不要)。
        const processorSource = `
class FSKDemodProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.bitRate = 300;
    this.freqOne = 1200;   // データ '1'
    this.freqZero = 2400;  // データ '0'
    this.samplesPerBit = Math.max(4, Math.round(sampleRate / this.bitRate));
    this.window = new Float32Array(this.samplesPerBit);
    this.writeIdx = 0;
    this.filled = 0;
    this.state = 'IDLE';       // IDLE: スタートビット待ち / RECEIVING: データビット取得中
    this.lastBitVal = 1;       // アイドル状態(マーク)は '1'
    this.stepCounter = 0;
    this.stepSize = Math.max(1, Math.floor(this.samplesPerBit / 8));
    this.sampleCounter = 0;    // スタートビット検出からの経過サンプル数
    this.byteBits = [];
    this.meterCounter = 0;
  }

  goertzelPower(buf, freq) {
    const N = buf.length;
    const k = Math.round(N * freq / sampleRate);
    const w = (2 * Math.PI / N) * k;
    const coeff = 2 * Math.cos(w);
    let q0 = 0, q1 = 0, q2 = 0;
    for (let i = 0; i < N; i++) {
      q0 = coeff * q1 - q2 + buf[i];
      q2 = q1;
      q1 = q0;
    }
    return q1 * q1 + q2 * q2 - q1 * q2 * coeff;
  }

  orderedWindow() {
    if (this.filled < this.samplesPerBit) {
      return this.window.slice(0, this.filled);
    }
    const ordered = new Float32Array(this.samplesPerBit);
    for (let i = 0; i < this.samplesPerBit; i++) {
      ordered[i] = this.window[(this.writeIdx + i) % this.samplesPerBit];
    }
    return ordered;
  }

  classify(buf) {
    const p1 = this.goertzelPower(buf, this.freqOne);
    const p0 = this.goertzelPower(buf, this.freqZero);
    return { bit: p1 >= p0 ? 1 : 0, level: Math.sqrt(p1 + p0) };
  }

  process(inputs) {
    const input = inputs[0];
    if (!input || !input[0]) return true;
    const channel = input[0];

    for (let i = 0; i < channel.length; i++) {
      this.window[this.writeIdx] = channel[i];
      this.writeIdx = (this.writeIdx + 1) % this.samplesPerBit;
      if (this.filled < this.samplesPerBit) this.filled++;

      this.stepCounter++;
      this.sampleCounter++;
      this.meterCounter++;

      if (this.meterCounter >= 2048) {
        this.meterCounter = 0;
        let peak = 0;
        for (let j = 0; j < channel.length; j++) peak = Math.max(peak, Math.abs(channel[j]));
        this.port.postMessage({ level: peak });
      }

      if (this.state === 'IDLE') {
        if (this.filled >= this.samplesPerBit && this.stepCounter >= this.stepSize) {
          this.stepCounter = 0;
          const { bit } = this.classify(this.orderedWindow());
          if (this.lastBitVal === 1 && bit === 0) {
            // 立ち下がりエッジ(マーク→スペース)= スタートビット開始とみなす
            this.state = 'RECEIVING';
            this.sampleCounter = 0;
            this.byteBits = [];
          }
          this.lastBitVal = bit;
        }
      } else if (this.state === 'RECEIVING') {
        const bitIndex = this.byteBits.length; // 0..7
        const targetSample = Math.round(this.samplesPerBit * (1.5 + bitIndex));
        if (this.sampleCounter === targetSample) {
          const { bit } = this.classify(this.orderedWindow());
          this.byteBits.push(bit);
          if (this.byteBits.length === 8) {
            let byteVal = 0;
            for (let b = 0; b < 8; b++) byteVal |= (this.byteBits[b] << b); // LSBファースト
            this.port.postMessage({ char: String.fromCharCode(byteVal) });
            this.state = 'IDLE';
            this.lastBitVal = 1;
          }
        }
      }
    }
    return true;
  }
}
registerProcessor('fsk-demod-processor', FSKDemodProcessor);
`;

        function setStatus(text, mode) {
            statusText.textContent = text;
            statusDot.className = 'dot' + (mode === 'on' ? ' on' : mode === 'err' ? ' err' : '');
        }

        async function start() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();

                const blob = new Blob([processorSource], { type: 'application/javascript' });
                const url = URL.createObjectURL(blob);
                await audioContext.audioWorklet.addModule(url);
                URL.revokeObjectURL(url);

                const source = audioContext.createMediaStreamSource(mediaStream);
                workletNode = new AudioWorkletNode(audioContext, 'fsk-demod-processor');

                workletNode.port.onmessage = (e) => {
                    const data = e.data;
                    if (!data) return;
                    if (data.char !== undefined) {
                        outputEl.value += data.char;
                        outputEl.scrollTop = outputEl.scrollHeight;
                    }
                    if (data.level !== undefined) {
                        meterFill.style.width = Math.min(100, data.level * 220) + '%';
                    }
                };

                // AudioWorkletNode を動かし続けるため、無音Gain経由でdestinationへ接続
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;
                source.connect(workletNode);
                workletNode.connect(silentGain);
                silentGain.connect(audioContext.destination);

                running = true;
                startBtn.textContent = '停止';
                startBtn.classList.add('running');
                setStatus('受信中…', 'on');
            } catch (err) {
                setStatus('エラー: ' + err.message, 'err');
            }
        }

        async function stop() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (audioContext) await audioContext.close();
            workletNode = null;
            audioContext = null;
            mediaStream = null;
            running = false;
            startBtn.textContent = 'マイク入力開始';
            startBtn.classList.remove('running');
            meterFill.style.width = '0%';
            setStatus('停止中', '');
        }

        startBtn.addEventListener('click', () => {
            if (!running) start(); else stop();
        });
    </script>
</body>

</html>
