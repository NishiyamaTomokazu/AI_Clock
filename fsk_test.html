<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSK 受信ツール (300bps)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #007AFF;
            color: white;
            font-weight: bold;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #stopBtn {
            background-color: #FF3B30;
        }
        #stopBtn:disabled {
            background-color: #ccc;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            font-size: 16px;
            font-family: monospace;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

    <h1>FSK データ受信 修2</h1>
    <p>仕様: 300bps / '0'(Space) = 1200Hz / '1'(Mark) = 2400Hz</p>

    <div class="controls">
        <button id="startBtn">マイク入力開始</button>
        <button id="stopBtn" disabled>マイク入力停止</button>
    </div>

    <textarea id="output" readonly placeholder="受信したデータがここに表示されます..."></textarea>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const output = document.getElementById('output');

        let audioContext;
        let mediaStream;
        let scriptProcessor;

        // FSK & UART デコード用の状態変数
        const BAUD_RATE = 300;
        const FREQ_SPACE = 1200; // '0'
        const FREQ_MARK = 2400;  // '1'
        
        let sampleRate = 44100;
        let samplesPerBit = sampleRate / BAUD_RATE;
        let sampleCount = 0;
        let currentBitValue = 1; // アイドル状態は '1' (Mark)
        let lastCrossing = 0;

        // UART 受信ステートマシン用
        let state = 'IDLE'; // IDLE, START, DATA, STOP
        let bitIndex = 0;
        let currentByte = 0;
        let samplesSinceBitCenter = 0;

        startBtn.addEventListener('click', async () => {
            try {
                // マイク入力の取得
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // Safari対応のため window.webkitAudioContext も考慮
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                sampleRate = audioContext.sampleRate;
                samplesPerBit = sampleRate / BAUD_RATE;

                const source = audioContext.createMediaStreamSource(mediaStream);
                
                // ScriptProcessorNodeの作成 (バッファサイズ2048)
                scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);

scriptProcessor.onaudioprocess = function(audioProcessingEvent) {
    const inputBuffer = audioProcessingEvent.inputBuffer;
    const inputData = inputBuffer.getChannelData(0);

    // 1. 今回のバッファの音量（RMS：実効値）を計算
    let sumSquares = 0;
    for (let i = 0; i < inputBuffer.length; i++) {
        sumSquares += inputData[i] * inputData[i];
    }
    const rms = Math.sqrt(sumSquares / inputBuffer.length);

    // 【重要】音量のしきい値（環境に合わせて調整してください）
    // 0.01 ～ 0.05 程度が目安です。
    const VOLUME_THRESHOLD = 0.02; 

    // 2. 音量がしきい値以下の場合は「無音状態」として処理をリセット
    if (rms < VOLUME_THRESHOLD) {
        state = 'IDLE';
        currentBitValue = 1; // FSKの待機状態(Mark=1)を維持
        return; // 以下のデコード処理を行わずスキップする
    }

    // 3. 音量が十分にある場合のみデコード処理を実行
    for (let i = 0; i < inputBuffer.length; i++) {
        const sample = inputData[i];
        sampleCount++;

        // ゼロクロス検出（ヒステリシス付き：微小な波のブレを無視）
        const HYS = 0.005; 
        if ((sample > HYS && lastCrossing <= 0) || (sample < -HYS && lastCrossing >= 0)) {
            const distance = sampleCount;
            sampleCount = 0;
            
            const freq = sampleRate / (distance * 2);
            currentBitValue = (freq > 1800) ? 1 : 0;
            
            lastCrossing = (sample > 0) ? 1 : -1;
        }

        // UARTの調歩同期デコード処理
        samplesSinceBitCenter++;

        if (state === 'IDLE') {
            if (currentBitValue === 0) {
                state = 'START';
                samplesSinceBitCenter = 0;
            }
        } else if (state === 'START') {
            if (samplesSinceBitCenter >= samplesPerBit / 2) {
                if (currentBitValue === 0) {
                    state = 'DATA';
                    bitIndex = 0;
                    currentByte = 0;
                    samplesSinceBitCenter = 0;
                } else {
                    state = 'IDLE';
                }
            }
        } else if (state === 'DATA') {
            if (samplesSinceBitCenter >= samplesPerBit) {
                if (currentBitValue === 1) {
                    currentByte |= (1 << bitIndex);
                }
                bitIndex++;
                samplesSinceBitCenter = 0;

                if (bitIndex >= 8) {
                    state = 'STOP';
                }
            }
        } else if (state === 'STOP') {
            if (samplesSinceBitCenter >= samplesPerBit) {
                if (currentBitValue === 1) {
                    // 制御文字(0x00~0x1F)や非ASCII文字を弾くフィルター
                    if (currentByte >= 32 && currentByte <= 126) {
                        const char = String.fromCharCode(currentByte);
                        output.value += char;
                        output.scrollTop = output.scrollHeight;
                    }
                }
                state = 'IDLE';
            }
        }
    }
};

                // ノードの接続
                //source.connect(scriptProcessor);
                //scriptProcessor.connect(audioContext.destination);

                // 【変更後】バンドパスフィルターを追加
                const filter = audioContext.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1800; // 1200Hzと2400Hzの中間を中心に設定
                filter.Q.value = 1.0;          // 通す周波数の幅

source.connect(filter);
filter.connect(scriptProcessor);
scriptProcessor.connect(audioContext.destination);

                startBtn.disabled = true;
                stopBtn.disabled = false;
                output.value += "[システム] マイク入力を開始しました。\n";

            } catch (err) {
                console.error('Error accessing microphone:', err);
                alert('マイクへのアクセスが拒否されたか、エラーが発生しました。');
            }
        });

        stopBtn.addEventListener('click', () => {
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            output.value += "\n[システム] マイク入力を停止しました。\n";
            
            // 状態のリセット
            state = 'IDLE';
            sampleCount = 0;
        });
    </script>
</body>
</html>
