<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSK信号 受信テスト</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    button { padding: 15px 30px; font-size: 18px; margin-bottom: 20px; }
    .status { font-size: 24px; font-weight: bold; margin: 20px 0; }
    .bar-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .bar-wrap { display: flex; flex-direction: column; align-items: center; }
    .bar { width: 50px; background-color: #ddd; height: 200px; position: relative; }
    .bar-fill { position: absolute; bottom: 0; width: 100%; background-color: #4CAF50; transition: height 0.1s; }
  </style>
</head>
<body>

  <h2>FSK (1200Hz / 2400Hz) モニター</h2>
  
  <button id="startBtn">マイク受信スタート</button>
  <div id="statusText" class="status">待機中...</div>

  <div class="bar-container">
    <div class="bar-wrap">
      <div>1200Hz (Mark: 1)</div>
      <div class="bar"><div id="bar1200" class="bar-fill" style="height: 0%;"></div></div>
    </div>
    <div class="bar-wrap">
      <div>2400Hz (Space: 0)</div>
      <div class="bar"><div id="bar2400" class="bar-fill" style="height: 0%;"></div></div>
    </div>
  </div>

  <script>
    let audioContext;
    let analyser;
    let animationId;

    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        // 1. マイクの使用許可をリクエスト
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        
        // 2. Web Audio APIのセットアップ
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        
        // 周波数解析器(AnalyserNode)の作成
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048; // 分解能の設定
        source.connect(analyser);

        document.getElementById('startBtn').disabled = true;
        document.getElementById('statusText').innerText = "マイク受信中...";
        
        // 3. 解析ループの開始
        analyzePitch();

      } catch (err) {
        alert('マイクへのアクセスが拒否されたか、エラーが発生しました: ' + err);
      }
    });

    function analyzePitch() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      
      // 現在の周波数ごとの音の強さを取得
      analyser.getByteFrequencyData(dataArray);

      // サンプリングレート(通常44100Hzか48000Hz)とFFTサイズから、1インデックスあたりの周波数を計算
      const sampleRate = audioContext.sampleRate;
      const hzPerBin = (sampleRate / 2) / bufferLength;

      // 1200Hz と 2400Hz が格納されている配列のインデックスを計算
      const index1200 = Math.round(1200 / hzPerBin);
      const index2400 = Math.round(2400 / hzPerBin);

      // それぞれの周波数の音の強さを取得 (0〜255)
      const val1200 = dataArray[index1200];
      const val2400 = dataArray[index2400];

      // 画面のバーの高さを更新 (%)
      document.getElementById('bar1200').style.height = (val1200 / 255 * 100) + '%';
      document.getElementById('bar2400').style.height = (val2400 / 255 * 100) + '%';

      // どちらの音が強いか判定
      const statusElement = document.getElementById('statusText');
      if (val1200 > 100 && val1200 > val2400) {
        statusElement.innerText = "検出: [1] (1200Hz)";
        statusElement.style.color = "blue";
      } else if (val2400 > 100 && val2400 > val1200) {
        statusElement.innerText = "検出: [0] (2400Hz)";
        statusElement.style.color = "red";
      } else {
        statusElement.innerText = "信号なし";
        statusElement.style.color = "black";
      }

      // 次のフレームで再度実行
      animationId = requestAnimationFrame(analyzePitch);
    }
  </script>
</body>
</html>
