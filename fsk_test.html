<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSK 受信テストツール</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f5f6fa;
        }
        h2 {
            color: #2f3640;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            font-size: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        #start-btn {
            background-color: #4cd137;
        }
        #start-btn:disabled {
            background-color: #a4b0be;
            cursor: not-allowed;
        }
        #stop-btn {
            background-color: #e84118;
        }
        #stop-btn:disabled {
            background-color: #a4b0be;
            cursor: not-allowed;
        }
        #status-text {
            font-weight: bold;
            margin-bottom: 10px;
            color: #7f8fa6;
        }
        #output {
            width: 100%;
            height: 300px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #dcdde1;
            border-radius: 6px;
            resize: vertical;
        }
    </style>
</head>
<body>

    <h2>🎤 FSK 受信テストツール1200bps</h2>
    
    <div class="controls">
        <button id="start-btn">受信開始</button>
        <button id="stop-btn" disabled>受信終了</button>
    </div>
    
    <div id="status-text">状態: 停止中</div>
    
    <textarea id="output" readonly placeholder="受信したデータがここに表示されます..."></textarea>

    <script>
        let audioContext;
        let analyser;
        let microphone;
        let isListening = false;
        let intervalId;

        // FSK通信の設定（マイコン側と合わせる）
        const FREQ_SPACE = 1200; // ビット0
        const FREQ_MARK  = 2400; // ビット1
        const BAUD_RATE  = 1200;   // 通信速度 (bps)
        const BIT_TIME_MS = 1000 / BAUD_RATE; // 1ビットあたりのミリ秒 (20ms)

        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusText = document.getElementById('status-text');
        const output = document.getElementById('output');

        // 受信開始ボタンの処理
        startBtn.addEventListener('click', async () => {
            try {
                // マイクへのアクセス要求
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                microphone = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.2;
                
                microphone.connect(analyser);
                isListening = true;
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusText.textContent = "状態: 受信中... (マイク監視中 🎙️)";
                statusText.style.color = "#4cd137";
                
                output.value += "--- 監視を開始しました ---\n";
                startFSKDecoder();
                
            } catch (err) {
                alert("マイクへのアクセスが拒否されたか、エラーが発生しました。\nブラウザのマイク許可設定を確認してください。");
                console.error(err);
            }
        });

        // 受信終了ボタンの処理
        stopBtn.addEventListener('click', () => {
            isListening = false;
            clearInterval(intervalId);
            
            if (audioContext) {
                audioContext.close(); // オーディオ処理を完全に停止
            }
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusText.textContent = "状態: 停止中";
            statusText.style.color = "#7f8fa6";
            
            output.value += "--- 監視を終了しました ---\n";
            output.scrollTop = output.scrollHeight;
        });

        // テキストエリアにデータを出力する関数
        function appendData(data) {
            const time = new Date().toLocaleTimeString();
            // 10進数と、確認しやすいように16進数を併記
            const hex = "0x" + data.toString(16).padStart(2, '0').toUpperCase();
            output.value += `[${time}] 受信: ${data} (${hex})\n`;
            output.scrollTop = output.scrollHeight; // 自動スクロール
        }

        // FSKデコード処理本体
        function startFSKDecoder() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const sampleRate = audioContext.sampleRate;
            
            // 目当ての周波数が入っている配列のインデックスを計算
            const spaceBin = Math.round(FREQ_SPACE * analyser.fftSize / sampleRate);
            const markBin  = Math.round(FREQ_MARK * analyser.fftSize / sampleRate);
            
            let state = 'IDLE';
            let bitBuffer = 0;
            let bitCount = 0;
            let lastBitTime = 0;
            
            // 3ミリ秒ごとに解析
            intervalId = setInterval(() => {
                if (!isListening) return;
                
                analyser.getByteFrequencyData(dataArray);
                
                // 周辺のビンの音量も見てピークを判定（多少の周波数ズレを許容）
                const spaceVol = Math.max(dataArray[spaceBin-1] || 0, dataArray[spaceBin], dataArray[spaceBin+1] || 0);
                const markVol  = Math.max(dataArray[markBin-1] || 0, dataArray[markBin], dataArray[markBin+1] || 0);
                
                let currentSignal = -1; // -1:無音, 0:SPACE(1200Hz), 1:MARK(2400Hz)
                const THRESHOLD = 80;   // 雑音を無視するしきい値(0~255)
                
                if (spaceVol > THRESHOLD && spaceVol > markVol + 20) {
                    currentSignal = 0;
                } else if (markVol > THRESHOLD && markVol > spaceVol + 20) {
                    currentSignal = 1;
                }
                
                const now = performance.now();
                
                switch (state) {
                    case 'IDLE':
                        // スタートビット (0) が来たら
                        if (currentSignal === 0) {
                            state = 'START_BIT';
                            lastBitTime = now;
                        }
                        break;
                        
                    case 'START_BIT':
                        // 0.5ビット時間経過時にまだ0なら、本物のスタートビットとみなす
                        if (now - lastBitTime >= BIT_TIME_MS / 2) {
                            if (currentSignal === 0) {
                                state = 'DATA_BITS';
                                bitCount = 0;
                                bitBuffer = 0;
                                lastBitTime = now + (BIT_TIME_MS / 2);
                            } else {
                                state = 'IDLE'; // ノイズだった
                            }
                        }
                        break;
                        
                    case 'DATA_BITS':
                        // 1ビット時間(20ms)ごとにサンプリング
                        if (now - lastBitTime >= BIT_TIME_MS) {
                            lastBitTime += BIT_TIME_MS;
                            
                            // MARK(1)ならフラグを立てる (LSBファースト)
                            if (currentSignal === 1) {
                                bitBuffer |= (1 << bitCount);
                            }
                            
                            bitCount++;
                            if (bitCount >= 8) {
                                state = 'STOP_BIT';
                            }
                        }
                        break;
                        
                    case 'STOP_BIT':
                        // ストップビットのタイミングで1バイトの受信完了処理
                        if (now - lastBitTime >= BIT_TIME_MS) {
                            appendData(bitBuffer);
                            state = 'IDLE';
                        }
                        break;
                }
            }, 3);
        }
    </script>
</body>
</html>
