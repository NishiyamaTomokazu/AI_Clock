<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Control App - STEP3</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="iframe-body">

<div class="app-container step0">
    <div class="hero-banner" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #333;">
        <div class="hero-icon">💻✨</div>
        <h1 class="hero-title">いよいよ「プログラミング」の世界へ！</h1>
    </div>

    <div class="step0-content">
        <p class="intro-text" style="text-align: left; margin-bottom: 20px;">
            <b>手動の魔法はここまで。次は「自動で動く魔法」を作ろう！</b><br><br>
            自分の手でボタンを押してLEDを光らせる試験、見事なクリアだったね！<br>
            でも、もし「手を叩いた瞬間に勝手に光る魔法」や「自動で色が変わり続けるイルミネーション」を作れたら、もっとすごいと思わない？
        </p>

        <p class="intro-text" style="text-align: left; margin-bottom: 40px;">
            それを叶えるのが<strong>「プログラミング」</strong>！<br>
            コンピュータに「こうやって動いてね」と指示を出せば、キミの代わりにいつでも正確に魔法をかけてくれるようになるんだ。<br>
            STEP4からは、いよいよプログラムを組んでLEDと音センサや押しボタンを操るよ。本当の魔法使いになる準備はいいかな？
        </p>

        <div style="text-align: center;">
            <button class="start-btn" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); color: white; box-shadow: 0 6px 15px rgba(161,140,209,0.4);" onclick="goToStep4()">
                プログラミングを始める（STEP4へ）🚀
            </button>
        </div>
    </div>
</div>

<script>
    window.goToStep4 = function() {
    if (window.parent && window.parent.document) {
        // STEP4のタブを表示してクリック
        const step4Tab = window.parent.document.getElementById('tab-step4');
        if (step4Tab) {
            step4Tab.style.display = 'inline-block';
            step4Tab.click();
        }
        // ★追加: 同時にSTEP5のタブも表示する
        const step5Tab = window.parent.document.getElementById('tab-step5');
        if (step5Tab) {
            step5Tab.style.display = 'inline-block';
        }
        // ★追加: STEP6のタブも同時に表示する
        const step6Tab = window.parent.document.getElementById('tab-step6');
        if (step6Tab) {
            step6Tab.style.display = 'inline-block';
        }
        // ★追加: STEP7のタブも同時に表示する
        const step7Tab = window.parent.document.getElementById('tab-step7');
        if (step7Tab) {
            step7Tab.style.display = 'inline-block';
        }
        // js/step3.js の goToStep4 関数内の末尾に追加
        const step8Tab = window.parent.document.getElementById('tab-step8');
        if (step8Tab) {
            step8Tab.style.display = 'inline-block';
        }
    }
}
</script>

</body>
</html>
