<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ステップ2 ヘルプ</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        h1 { color: #007bff; }
    </style>
</head>
<body>
    <h1>ステップ2の使い方</h1>
    <p>ここでは、指定された色をすばやく作る「3秒チャレンジ」ゲームに挑戦します。</p>
    <ul>
        <li><strong>「スタート」ボタン</strong>を押すとゲームが始まります。</li>
        <li>画面に「〇〇を点灯させてください」と表示されるので、左側のボタンを組み合わせて3秒以内にその色を作りましょう。</li>
        <li>3秒経つとタイムアップになってしまいます。</li>
        <li>5問連続で正解するとクリアです！</li>
    </ul>
    <p>❗️色の作り方のヒント<br>
        ・黄色 ＝ 赤 ＋ 緑<br>
        ・水色 ＝ 緑 ＋ 青<br>
        ・紫 ＝ 赤 ＋ 青<br>
        ・白 ＝ 赤 ＋ 緑 ＋ 青
    </p>
</body>
</html>
