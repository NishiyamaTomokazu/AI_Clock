<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSK デコーダー (200 bps)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f7f9fa; color: #333; }
    .controls { display: flex; gap: 12px; margin: 12px 0 16px; flex-wrap: wrap; }
    button { font-size: 16px; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    #btnStart { background: #007aff; color: #fff; }
    #btnStop, #btnClear { background: #e5e5ea; color: #333; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    textarea { width: 100%; box-sizing: border-box; height: 240px; font-family: monospace; font-size: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  </style>
</head>
<body>
  <h2>FSK デコーダー (200 bps)</h2>

  <div class="controls">
    <button id="btnStart">マイク入力開始</button>
    <button id="btnStop" disabled>マイク入力停止</button>
    <button id="btnClear">クリア</button>
  </div>

  <textarea id="txtOutput" readonly placeholder="ここに受信したデータが表示されます..."></textarea>

  <script type="module">
    import { FskReceiver } from './js/fsk-receiver.js';

    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnClear = document.getElementById('btnClear');
    const txtOutput = document.getElementById('txtOutput');

    let rx = null;

    btnStart.addEventListener('click', async () => {
      btnStart.disabled = true;
      // rx = new FskReceiver({
      //   baud: 200,        // 200 bps
      //   freq0: 1200,      // "0" = 1200 Hz
      //   freq1: 2200,      // "1" = 2200 Hz
      //   threshold: 0.01,  // 信号とみなす最小振幅 (反応しないときは小さく、ノイズを拾うときは大きく)
      //   onText: (s) => {
      //     txtOutput.value += s;
      //     txtOutput.scrollTop = txtOutput.scrollHeight;
      //   }
      // });
      rx = new FskReceiver({
        baud: 200,        // 200 bps
        freq0: 1200,      // "0" = 1200 Hz
        freq1: 2200,      // "1" = 2200 Hz
        threshold: 0.01,  // 信号とみなす最小振幅 (反応しないときは小さく、ノイズを拾うときは大きく)
        onByte: (value) => {
          txtOutput.value += value + '\n';
          txtOutput.scrollTop = txtOutput.scrollHeight;
        }
      });
      try {
        await rx.start();
        btnStop.disabled = false;
      } catch (err) {
        alert('マイクを開始できませんでした: ' + err.message);
        rx = null;
        btnStart.disabled = false;
      }
    });

    btnStop.addEventListener('click', async () => {
      btnStop.disabled = true;
      if (rx) await rx.stop();
      rx = null;
      btnStart.disabled = false;
    });

    btnClear.addEventListener('click', () => {
      txtOutput.value = '';
    });
  </script>
</body>
</html>
