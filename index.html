<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>LED Control App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="main-body">
    <div class="tabs">
        <button class="tab-btn active" onclick="loadTab('step1.html', this)">STEP1</button>
        <button class="tab-btn" onclick="loadTab('step2.html', this)">STEP2</button>
        <button class="tab-btn" onclick="loadTab('step3.html', this)">確認2</button>
        <button class="tab-btn" id="help-btn" onclick="openHelp()">❓ ヘルプを開く</button>
    </div>

    <iframe id="content-frame" src="step1.html" allow="hid"></iframe>

    <dialog id="help-dialog">
        <div class="dialog-header">
            <h3>ヘルプ</h3>
            <button class="close-btn" onclick="closeHelp()">閉じる</button>
        </div>
        <iframe id="help-frame" style="width: 100%; height: calc(100% - 50px); border: none;"></iframe>
    </dialog>

    <script src="js/main.js"></script>
</body>
</html>
