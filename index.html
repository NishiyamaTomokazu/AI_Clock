<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ★追加: iPadやスマホで正しいサイズで表示させるための設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LED Control App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="main-body">
    <div class="tabs">
        <button class="tab-btn active" onclick="loadTab('step0.html', this)">STEP0</button>
        <button class="tab-btn" onclick="loadTab('step1.html', this)">STEP1</button>
        <button class="tab-btn" onclick="loadTab('step2.html', this)">STEP2</button>
        <button class="tab-btn" id="tab-step3" style="display: none;" onclick="loadTab('step3.html', this)">STEP3</button>
        <button class="tab-btn" id="tab-step4" style="display: none;" onclick="loadTab('step4.html', this)">STEP4</button>
        
        <button class="tab-btn" id="help-btn" onclick="openHelp()">❓ ヘルプを開く</button>
    </div>

    <iframe id="content-frame" src="step0.html" allow="hid"></iframe>

    <dialog id="help-dialog">
        <div class="dialog-header">
            <h3>ヘルプ</h3>
            <button class="close-btn" onclick="closeHelp()">閉じる</button>
        </div>
        <iframe id="help-frame" style="width: 100%; height: calc(100% - 50px); border: none;"></iframe>
    </dialog>

    <script src="js/main.js"></script>
</body>
</html>
