<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ★追加: iPadやスマホで正しいサイズで表示させるための設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LED Control App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="main-body">
    <div class="tabs">
        <button class="tab-btn active" onclick="loadTab('step0.html', this)">STEP0</button>
        <button class="tab-btn" onclick="loadTab('step1.html', this)">STEP1</button>
        <button class="tab-btn" onclick="loadTab('step2.html', this)">STEP2</button>
        <button class="tab-btn" id="tab-step3" style="display: none;" onclick="loadTab('step3.html', this)">STEP3</button>
        <button class="tab-btn" id="tab-step4" style="display: none;" onclick="loadTab('step4.html', this)">STEP4</button>
        <button class="tab-btn" id="tab-step5" style="display: none;" onclick="loadTab('step5.html', this)">STEP5</button>
        <button class="tab-btn" id="tab-step6" style="display: none;" onclick="loadTab('step6.html', this)">STEP6</button>
        <button class="tab-btn" id="tab-step7" style="display: none;" onclick="loadTab('step7.html', this)">STEP7</button>
        <button class="tab-btn" id="tab-step8" style="display: none;" onclick="loadTab('step8.html', this)">STEP8</button>
        
        <button class="tab-btn" id="help-btn" onclick="openHelp()">❓ ヘルプを開く</button>
    </div>

    <iframe id="content-frame" src="step0.html" allow="hid"></iframe>

    <dialog id="help-dialog">
        <div class="dialog-header">
            <h3>ヘルプ</h3>
            <button class="close-btn" onclick="closeHelp()">閉じる</button>
        </div>
        <iframe id="help-frame" style="width: 100%; height: calc(100% - 50px); border: none;"></iframe>
    </dialog>

<!-- ヘルプ表示用の共通スクリプト (既存のmain.jsから抜き出し) -->
    <script>
        let currentHelpUrl = 'help/step1_help.html';

        function loadTab(url, btnElement) {
            const frame = document.getElementById('content-frame');
            currentHelpUrl = 'help/' + url.replace('.html', '_help.html');
            frame.src = url;
            document.querySelectorAll('.tab-btn:not(#help-btn)').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function openHelp() {
            const dialog = document.getElementById('help-dialog');
            document.getElementById('help-frame').src = currentHelpUrl;
            dialog.showModal();
        }

        function closeHelp() { 
            document.getElementById('help-dialog').close(); 
        }

        // ==========================================
        // OSを判定して適切な通信モジュールを読み込む
        // ==========================================
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        const script = document.createElement('script');
        if (isIOS) {
            script.src = 'js/main_ipad.js';
        } else {
            script.src = 'js/main_webhid.js';
        }
        document.body.appendChild(script);
    </script>
</body>
</html>
