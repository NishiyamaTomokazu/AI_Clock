<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Control App - STEP2</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="iframe-body">
<div class="app-container step2">
    <div class="content-wrapper">
        <div class="left-panel">
            <div class="header-controls"><button class="connect-btn" id="connect-btn">🔌 接続</button></div>
            <div class="led-container"><div class="led" id="led-image"></div></div>
            <div class="controls">
                <div class="color-col">
                    <span class="color-label">赤</span>
                    <button class="btn on-btn" id="red-on" ontouchstart="turnOn(1); event.preventDefault();">ON</button>
                    <button class="btn off-btn" id="red-off" ontouchstart="turnOff(1); event.preventDefault();">OFF</button>
                </div>
                <div class="color-col">
                    <span class="color-label">緑</span>
                    <button class="btn on-btn" id="green-on" ontouchstart="turnOn(2); event.preventDefault();">ON</button>
                    <button class="btn off-btn" id="green-off" ontouchstart="turnOff(2); event.preventDefault();">OFF</button>
                </div>
                <div class="color-col">
                    <span class="color-label">青</span>
                    <button class="btn on-btn" id="blue-on" ontouchstart="turnOn(4); event.preventDefault();">ON</button>
                    <button class="btn off-btn" id="blue-off" ontouchstart="turnOff(4); event.preventDefault();">OFF</button>
                </div>
            </div>
            <div class="end-container"><button class="btn" id="end-btn" ontouchstart="endApp(); event.preventDefault();">終了</button></div>
            <div class="state-display">現在の変数(appState): <span id="state-val">0</span><br>デバイス状況: <span id="device-status">未接続</span></div>
        </div>
        <div class="right-panel">
            <div class="game-header">3秒チャレンジ</div>
            <button class="start-btn" id="start-game-btn" ontouchstart="startGame(); event.preventDefault();">スタート</button>
            <div style="text-align: center;">
                <div class="question-num" id="question-num"></div>
                <div class="game-message" id="game-message">ボタンを押して開始</div>
            </div>
        </div>
    </div>
</div>
<script src="js/step2.js"></script>
</body>
</html>
