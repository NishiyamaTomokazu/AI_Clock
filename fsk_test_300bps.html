<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSK 100bps Receiver (iPad)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f7f9fa; color: #333; }
    h2 { margin-bottom: 8px; }
    .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    button { font-size: 16px; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    #btnStart { background-color: #007aff; color: white; }
    #btnStop, #btnClear { background-color: #e5e5ea; color: #333; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status-panel { font-size: 14px; margin-bottom: 12px; color: #666; line-height: 1.8; }
    .tone-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background-color: #ccc; }
    textarea { width: 100%; box-sizing: border-box; height: 220px; font-family: monospace; font-size: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    input[type=range] { vertical-align: middle; width: 200px; }
  </style>
</head>
<body>

  <h2>FSK (100 bps) デコーダー</h2>
  <div class="status-panel">
    ステータス: <span id="lblStatus">停止中</span> |
    検出信号: <span id="toneIndicator" class="tone-indicator"></span><span id="lblTone">-</span><br>
    入力レベル: <span id="lblLevel">0.000</span> |
    検出しきい値: <input type="range" id="rngThr" min="0.001" max="0.2" step="0.001" value="0.01"> <span id="lblThr">0.010</span> |
    フレームエラー: <span id="lblErr">0</span>
  </div>

  <div class="controls">
    <button id="btnStart">マイク入力開始</button>
    <button id="btnStop" disabled>マイク入力停止</button>
    <button id="btnClear">クリア</button>
  </div>

  <h3>受信データ</h3>
  <textarea id="txtOutput" readonly placeholder="ここに受信したデータが表示されます..."></textarea>

  <script>
    // --- 通信パラメータ ---
    const FREQ_SPACE = 1200; // "0"
    const FREQ_MARK  = 2200; // "1"
    const BIT_RATE   = 100;  // 100 bps

    // --- Web Audio 関連 ---
    let audioCtx = null, micStream = null, scriptNode = null;

    // --- 復調パラメータ (開始時に sampleRate から計算) ---
    let sampleRate = 44100;
    let spb = 441;        // 1ビットあたりのサンプル数 (小数可)
    let W = 221;          // 判定窓長 (約1/2ビット)
    let STEP = 27;        // 判定間隔 (約1/16ビット)
    let tabCos0, tabSin0, tabCos1, tabSin1;

    // リングバッファ
    const RING = 8192, MASK = RING - 1;
    const ring = new Float32Array(RING);
    let n = 0; // 受信済み総サンプル数

    // UART 受信状態
    const ST_IDLE = 0, ST_RECV = 1;
    let rxState = ST_IDLE;
    let armed = false;      // アイドル("1")を確認済みか (立ち下がりエッジ検出用)
    let edgeN = 0;          // スタートビット立ち上がり(0への遷移)の推定位置
    let bitIndex = 0;       // 0=start, 1..8=data, 9=stop
    let nextCheckN = 0;
    let receivedByte = 0;
    let errCount = 0;

    // 表示用
    let lastTone = -1, lastAmp = 0;
    let threshold = 0.01;

    // バイト列を UTF-8 としてデコード (ASCII はそのまま、日本語も可)
    const decoder = new TextDecoder('utf-8');

    // UI要素
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnClear = document.getElementById('btnClear');
    const lblStatus = document.getElementById('lblStatus');
    const lblTone = document.getElementById('lblTone');
    const lblLevel = document.getElementById('lblLevel');
    const lblThr = document.getElementById('lblThr');
    const lblErr = document.getElementById('lblErr');
    const rngThr = document.getElementById('rngThr');
    const toneIndicator = document.getElementById('toneIndicator');
    const txtOutput = document.getElementById('txtOutput');

    rngThr.addEventListener('input', () => {
      threshold = parseFloat(rngThr.value);
      lblThr.textContent = threshold.toFixed(3);
    });
    btnClear.addEventListener('click', () => { txtOutput.value = ''; errCount = 0; lblErr.textContent = '0'; });

    /** 参照波テーブル作成 (窓内で整数周期に近くなる正確な周波数で相関を取る) */
    function makeTable(freq) {
      const c = new Float32Array(W), s = new Float32Array(W);
      for (let i = 0; i < W; i++) {
        const ph = 2 * Math.PI * freq * i / sampleRate;
        c[i] = Math.cos(ph);
        s[i] = Math.sin(ph);
      }
      return [c, s];
    }

    /** 直近 W サンプルと参照波の相関から、その周波数の振幅を推定 */
    function toneAmplitude(tc, ts) {
      let I = 0, Q = 0;
      let idx = (n - W) & MASK;
      for (let i = 0; i < W; i++) {
        const v = ring[idx];
        I += v * tc[i];
        Q += v * ts[i];
        idx = (idx + 1) & MASK;
      }
      return Math.sqrt(I * I + Q * Q) * 2 / W;
    }

    /** 現在の窓のビット値 (0 / 1 / -1=信号なし) */
    function detectTone() {
      const a0 = toneAmplitude(tabCos0, tabSin0);
      const a1 = toneAmplitude(tabCos1, tabSin1);
      lastAmp = Math.max(a0, a1);
      if (lastAmp < threshold) return -1;
      return (a1 > a0) ? 1 : 0;
    }

    /** 判定結果 d を時刻 n で受け取り、UART を復調 */
    function uartStep(d) {
      if (rxState === ST_IDLE) {
        if (d === 1) {
          armed = true;
        } else if (d === -1) {
          armed = false;
        } else if (d === 0 && armed) {
          // 1→0 の遷移を検出。窓の中心がエッジを通過した時点で判定が反転するので、
          // エッジ位置 ≒ n - W/2
          edgeN = n - W / 2;
          bitIndex = 0;
          receivedByte = 0;
          rxState = ST_RECV;
          nextCheckN = edgeN + (bitIndex + 0.5) * spb + W / 2;
        }
        return;
      }

      // ST_RECV: 各ビット中央が窓の中心に来る時刻で判定
      if (n < nextCheckN) return;

      if (bitIndex === 0) {
        // スタートビット確認
        if (d !== 0) { rxState = ST_IDLE; armed = (d === 1); return; }
      } else if (bitIndex <= 8) {
        if (d === -1) { rxState = ST_IDLE; armed = false; return; }
        if (d === 1) receivedByte |= (1 << (bitIndex - 1));
      } else {
        // ストップビット確認
        if (d === 1) {
          const ch = decoder.decode(new Uint8Array([receivedByte]), { stream: true });
          if (ch) {
            txtOutput.value += ch;
            txtOutput.scrollTop = txtOutput.scrollHeight;
          }
          armed = true;
        } else {
          errCount++;
          lblErr.textContent = errCount;
          armed = false;
        }
        rxState = ST_IDLE;
        return;
      }
      bitIndex++;
      nextCheckN = edgeN + (bitIndex + 0.5) * spb + W / 2;
    }

    /** マイク入力開始 */
    async function startListening() {
      try {
        // iOS Safari ではユーザー操作イベント内で AudioContext を作成/resume する
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        sampleRate = audioCtx.sampleRate;
        spb = sampleRate / BIT_RATE;
        W = Math.round(spb / 2);                 // 1/2ビット窓 (1200Hz=6周期, 2200Hz=11周期)
        STEP = Math.max(1, Math.round(spb / 16));
        [tabCos0, tabSin0] = makeTable(FREQ_SPACE);
        [tabCos1, tabSin1] = makeTable(FREQ_MARK);

        // 状態リセット
        ring.fill(0); n = 0;
        rxState = ST_IDLE; armed = false; errCount = 0; lblErr.textContent = '0';

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });

        const source = audioCtx.createMediaStreamSource(micStream);
        scriptNode = audioCtx.createScriptProcessor(1024, 1, 1);

        scriptNode.onaudioprocess = (e) => {
          const input = e.inputBuffer.getChannelData(0);
          for (let i = 0; i < input.length; i++) {
            ring[n & MASK] = input[i];
            n++;
            if (n >= W && (n % STEP) === 0) {
              const d = detectTone();
              lastTone = d;
              uartStep(d);
            }
          }

          // UI更新はコールバックごとに1回だけ
          lblLevel.textContent = lastAmp.toFixed(3);
          if (lastTone === 1) {
            lblTone.textContent = "1 (2200Hz - Mark)";
            toneIndicator.style.backgroundColor = "#34c759";
          } else if (lastTone === 0) {
            lblTone.textContent = "0 (1200Hz - Space)";
            toneIndicator.style.backgroundColor = "#ff9500";
          } else {
            lblTone.textContent = "無音 / ノイズ";
            toneIndicator.style.backgroundColor = "#ccc";
          }
        };

        source.connect(scriptNode);
        scriptNode.connect(audioCtx.destination); // Safari 駆動用 (出力は無音)

        btnStart.disabled = true;
        btnStop.disabled = false;
        lblStatus.textContent = `受信待機中 (${sampleRate} Hz)`;
      } catch (err) {
        alert("マイクへのアクセスに失敗しました: " + err.message);
      }
    }

    /** マイク入力停止 */
    function stopListening() {
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (scriptNode) { scriptNode.onaudioprocess = null; scriptNode.disconnect(); scriptNode = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }

      btnStart.disabled = false;
      btnStop.disabled = true;
      lblStatus.textContent = "停止中";
      lblTone.textContent = "-";
      toneIndicator.style.backgroundColor = "#ccc";
      rxState = ST_IDLE; armed = false;
    }

    btnStart.addEventListener('click', startListening);
    btnStop.addEventListener('click', stopListening);
  </script>
</body>
</html>
